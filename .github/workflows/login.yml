# Finishes a LinkedIn login. Starts when the repo owner creates the "LinkedIn login code" issue
# (the login page fills that issue in for you). Issues from anyone else are ignored.
name: LinkedIn login

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: linkedin-login
  cancel-in-progress: false

jobs:
  login:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'LinkedIn login code')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Swap the code for a new login
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m poster login
      - name: Save the new login
        if: always()
        run: |
          git config user.name "linkedin-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f state/token.enc ]; then git add state/token.enc; fi
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Robot: new LinkedIn login saved"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 10
          done
          exit 1
