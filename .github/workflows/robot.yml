# The robot. Runs every 15 minutes: checks the LinkedIn login, posts rows whose time has come.
name: LinkedIn robot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Force practice mode for this run (posts nothing)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: linkedin-robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python -m poster run
      - name: Save progress
        if: always()
        run: |
          git config user.name "linkedin-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Robot: update state"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 10
          done
          exit 1
